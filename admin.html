<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Herrajuq Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,400..900&family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{--ground:#FFFFFF;--sheet:#FFFFFF;--panel:#EEF4F4;--rule:#D3E0E0;--rule-strong:#A9C3C3;--ink:#1E2424;--ink-2:#4A5858;--ink-3:#687878;--teal:#2F5F61;--teal-hi:#3B7275;--on-teal:#EEF6F5;--on-teal-2:#B4CFCE;--glass:#2E7D78;--glass-hover:#256A66;--glass-soft:#D5EAE8;--warn:#8A5300;--warn-soft:#F6E7CF;--bad:#A33030;--bad-soft:#F7DEDE;--f-disp:"Noto Serif Display",Georgia,serif;--f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.top{background:var(--teal);color:var(--on-teal);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top b{font-family:var(--f-disp);font-weight:900;font-stretch:62.5%;font-size:30px;letter-spacing:.01em;line-height:1}
.top span{color:var(--on-teal-2);font-size:13px}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;color:var(--on-teal-2);padding:8px 12px;border-radius:8px;font-weight:650}
.tabs button[aria-current="page"]{background:var(--on-teal);color:var(--teal)}

h1{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:30px;margin:0 0 14px;padding-bottom:8px;border-bottom:4px double var(--glass);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{border:1px solid var(--rule-strong);border-radius:8px;padding:8px 10px;min-width:220px}
.seg{display:inline-flex;background:var(--panel);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(30,52,53,.16)}
.btn{border:0;border-radius:8px;padding:7px 12px;font-weight:650;font-size:14px;background:var(--glass);color:#fff;white-space:nowrap}
.btn:hover{background:var(--glass-hover)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45}
.wrapT{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
tr.det td{background:#F7FAFA}
.fol{font-weight:750;font-stretch:85%;letter-spacing:.03em;white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:650}
.tag.nuevo{background:var(--warn-soft);color:var(--warn)}.tag.atendido{background:var(--glass-soft);color:var(--glass)}.tag.activo{background:var(--glass-soft);color:var(--glass)}.tag.bloqueado,.tag.eliminado{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--ink-3)}
.key{font-weight:700;font-stretch:80%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:18px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv span:nth-child(odd){color:var(--ink-3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
a{color:var(--glass)}
.box{max-width:420px;margin:60px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.box input{border:1px solid var(--rule-strong);border-radius:8px;padding:10px 12px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-weight:600;z-index:9}
.toast[hidden]{display:none}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.box.wide{max-width:640px}
.arow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e3e8e8}
.arow input{flex:1}
.muted{color:#5b6b6b}
</style>
</head>
<body>
<div class="top"><div><b>HERRAJUQ</b> <span>Administración de clientes y pedidos</span></div><nav class="tabs" id="tabs" hidden></nav><span id="who"></span></div>
<main id="main"></main>

function msgVitrina(p){
  var e=p.entrega||{},L=['*Pedido '+p.folio+'*','Cliente: '+((p.cliente&&p.cliente.nombre)||''),'Teléfono: '+((p.cliente&&p.cliente.tel)||'')];

  if(p.nota){L.push('');L.push('Comentarios: '+p.nota)}return L.join('\n')}
function drawP(){
  var q=el('input',{class:'in',type:'search',placeholder:'Buscar folio, cliente o teléfono'});

  function rows(){list.textContent='';var s=q.value.toLowerCase();
    var L=P.filter(function(p){return (fP==='todos'||p.estado===fP)&&(!s||(p.folio+' '+(p.cliente&&p.cliente.nombre)+' '+(p.cliente&&p.cliente.tel)).toLowerCase().indexOf(s)>=0)});

        tb.appendChild(el('tr',{class:'det'},[el('td',{colspan:'6'},[el('div',{class:'grid'},[el('div',{class:'wrapT'},[el('table',null,[el('thead',null,[el('tr',null,[el('th',{text:'Clave'}),el('th',{text:'Producto'}),el('th',{text:'Cantidad'})])]),it])]),

var unsub=[];
auth.onAuthStateChanged(function(u){unsub.forEach(function(f){f()});unsub=[];
  if(!u){login();return}
  $('who').textContent=u.email+' ';$('who').appendChild(el('button',{class:'btn sec',type:'button',text:'Salir',onclick:function(){auth.signOut()}}));
  ME=(u.email||'').toLowerCase();
  (ME===OWNER?Promise.resolve({exists:true}):db.collection('admins').doc(ME).get()).then(function(s){
    if(!s.exists){noAdmin(u);return}
