<style>
:root{
  --ground:#FFFFFF; --sheet:#FFFFFF; --panel:#EEF4F4; --rule:#CADADA; --rule-strong:#9FBDBD;
  --ink:#1E2424; --ink-2:#4A5858; --ink-3:#6A7A7A;
  --teal:#2F5F61; --teal-deep:#244B4D; --on-teal:#EEF6F5; --on-teal-2:#B9D3D2;
  --glass:#2E7D78; --glass-hover:#256A66; --on-glass:#FFFFFF; --glass-soft:#D5EAE8; --glass-pane:#79B9B4;
  --alu:#8A9494; --alu-on-teal:#86A9A8; --alu-hi:#2F5F61;
  --warn:#8A5300; --warn-soft:#F5E6CC; --bad:#A33030; --bad-soft:#F6DCDC;
  --scrim:rgba(18,30,31,.52);
  --lift:0 1px 2px rgba(30,52,53,.08),0 12px 32px -8px rgba(30,52,53,.22);
  --f-disp:"Noto Serif Display","Bodoni 72","Didot",Georgia,serif;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;margin:0;padding-inline:0;padding-block:0 104px}
::selection{background:var(--glass-soft);color:var(--ink)}
*{scrollbar-color:var(--rule-strong) transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.gut{padding-inline:16px}
.wrap{max-width:1120px;margin-inline:auto}
.key{font-stretch:78%;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* encabezado de marca */
.mast{background:var(--teal);color:var(--on-teal);overflow:hidden}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px 10px}
.mark{display:flex;align-items:flex-end;gap:2px;min-width:0;color:var(--on-teal);text-decoration:none}
.mark svg{width:30px;height:40px;flex:none}
.mark b{font-family:var(--f-disp);font-weight:900;font-stretch:62.5%;font-size:42px;line-height:.8;letter-spacing:.005em;display:inline-flex;align-items:flex-end}
.mark .q{position:relative;display:inline-block}

.mast-sub{font-family:var(--f-disp);font-stretch:62.5%;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--on-teal);margin-top:8px;padding-block:2px;border-top:1px solid var(--on-teal-2);border-bottom:1px solid var(--on-teal-2);display:inline-block}
.pill-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--on-teal-2);background:transparent;color:var(--on-teal);border-radius:999px;padding:8px 14px 8px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.pill-btn:hover{background:var(--teal-deep)}
@media (max-width:420px){.pill-btn{padding:8px 10px}.pill-btn .lbl{display:none}}
.pill-btn .n{font-variant-numeric:tabular-nums;background:var(--on-teal);color:var(--teal);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding-inline:6px}
.band{display:flex;align-items:flex-end;gap:14px;height:46px;padding-bottom:8px;border-top:1px solid rgba(255,255,255,.12);overflow:hidden;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.band i{display:block;flex:none;width:38px;height:38px;background:var(--alu-on-teal);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

/* barra fija de búsqueda */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--rule);padding-block:12px}
.tools-in{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
@media (max-width:700px){.tools-in{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--panel);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(30,52,53,.14)}
@media (max-width:700px){.seg{display:flex}.seg button{flex:1}}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:11px 12px 11px 42px;font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--glass);outline:none;box-shadow:0 0 0 3px var(--glass-soft)}

/* títulos de sección al estilo del logo */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding-bottom:8px;border-bottom:4px double var(--glass)}
.sec-h h1{font-family:var(--f-disp);font-weight:800;font-stretch:72%;font-size:30px;line-height:1.05;margin:0;letter-spacing:.005em;text-wrap:balance}
.sec-h p{margin:0;color:var(--ink-2);font-size:14px}
.note{margin:12px 0 0;font-size:14px;color:var(--ink-2);max-width:70ch}

/* hoja de catálogo */
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));margin-top:16px;border-top:1px solid var(--rule);border-left:1px solid var(--rule);background:var(--sheet)}
@media (max-width:420px){.sheetgrid{grid-template-columns:1fr 1fr}}
.cell{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:transparent;padding:12px 12px 14px;min-width:0;transition:background-color .16s ease-out}
.cell:hover{background:var(--panel)}
.sil{aspect-ratio:1;width:100%;max-width:100%;display:grid;place-items:center;margin-bottom:8px}
.sil i{display:block;width:82%;height:82%;background:var(--alu);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;transition:background-color .16s ease-out,transform .2s cubic-bezier(.2,.8,.2,1)}
.cell:hover .sil i{background:var(--alu-hi);transform:scale(1.04)}
.sil .none{font-size:12px;color:var(--ink-3);text-align:center;padding:12px;border:1px dashed var(--rule-strong);border-radius:6px;width:82%;aspect-ratio:1;display:grid;place-items:center}
.cell .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cell .k b{font-size:21px;line-height:1.1}
.cell .k span{font-size:12px;color:var(--ink-3);font-stretch:85%;font-weight:600;white-space:nowrap}
.cell .nm{font-size:14px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.fin{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);display:inline-block;flex:none}

/* lista de herrajes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--rule-strong)}
.chip[aria-pressed="true"]{background:var(--glass);border-color:var(--glass);color:var(--on-glass);font-weight:600}
.rows{margin-top:16px;background:var(--sheet);border-top:1px solid var(--rule)}
.r{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 4px 10px 0;border-bottom:1px solid var(--rule)}
.r .t{min-width:0}
.ph{display:grid;place-items:center;background:#FFFFFF;border-radius:8px;overflow:hidden}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.r .ph{width:64px;height:64px;margin-left:8px}
.r .ph.none{background:var(--panel)}
.photo{aspect-ratio:4/3;border:1px solid var(--rule);padding:12px}
.r .t div{overflow-wrap:anywhere}
.r .t small{display:block;color:var(--ink-3);font-size:13px}
.more{display:block;margin:16px auto 0}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2);max-width:46ch;margin-inline:auto}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:650;font-size:16px;background:var(--glass);color:var(--on-glass);text-decoration:none;transition:background-color .15s ease-out}
.btn:hover{background:var(--glass-hover)}
.btn.sec{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.btn.sec:hover{background:var(--panel)}
.btn.sm{padding:8px 13px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;font-size:15px}
.link:hover{color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule-strong);border-radius:10px;background:var(--sheet);overflow:hidden}
.stepper button{border:0;background:transparent;width:42px;height:42px;display:grid;place-items:center;color:var(--ink)}
.stepper button:hover{background:var(--panel)}

<script>

var ICO={pin:'<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'};

/* ---------- mapa (OpenStreetMap, sin llave) ---------- */
var LEAF='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/',NOM='https://nominatim.openstreetmap.org/';
var CENTRO=[19.1236,-98.7666];
function loadLeaflet(){if(window.L)return Promise.resolve();if(loadLeaflet.p)return loadLeaflet.p;
  loadLeaflet.p=new Promise(function(res,rej){var l=document.createElement('link');l.rel='stylesheet';l.href=LEAF+'leaflet.css';document.head.appendChild(l);var s=document.createElement('script');s.src=LEAF+'leaflet.js';s.onload=res;s.onerror=function(){loadLeaflet.p=null;rej()};document.head.appendChild(s)});return loadLeaflet.p}
function nrm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function matchLoc(a){var cands=[a.city,a.town,a.village,a.municipality,a.county,a.city_district].map(nrm).join(' | ');
  for(var i=0;i<LOCS.length-1;i++){if(cands.indexOf(nrm(LOCS[i]))>=0)return LOCS[i]}return LOCS[LOCS.length-1]}
function mapPicker(initial,onPick){
  var box=el('div',{class:'mapbox'}),status=el('div',{class:'gps'}),cur=initial||null,map=null,mk=null;
  var q=el('input',{type:'search',class:'mapq',placeholder:'Busca tu calle, ej. Hidalgo, Ozumba','aria-label':'Buscar dirección'});
  var res=el('div',{class:'mapres'});
  var area=el('div',{class:'maparea',role:'application','aria-label':'Mapa: toca donde está tu casa'});
  function setStatus(t,ok){status.textContent='';if(ok)status.appendChild(el('span',{class:'ok'},[svg(ICO.check),t]));else status.appendChild(el('span',{text:t}));
    if(cur)status.appendChild(el('a',{href:'https://maps.google.com/?q='+cur.lat+','+cur.lng,target:'_blank',rel:'noopener',text:'Ver en Google Maps'}))}
  function place(lat,lng,fly){cur={lat:Math.round(lat*1e6)/1e6,lng:Math.round(lng*1e6)/1e6};
    if(map){if(!mk){mk=L.marker([lat,lng],{draggable:true,icon:L.divIcon({className:'pin',html:'<svg viewBox="0 0 30 40" width="30" height="40"><path d="M15 39s13-13.5 13-23.5A13 13 0 0 0 2 15.5C2 25.5 15 39 15 39z" fill="#2E7D78" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15.5" r="5" fill="#fff"/></svg>',iconSize:[30,40],iconAnchor:[15,39]})}).addTo(map);mk.on('dragend',function(){var p=mk.getLatLng();place(p.lat,p.lng,false)})}else mk.setLatLng([lat,lng]);if(fly)map.setView([lat,lng],17)}
    setStatus('Buscando la dirección…');onPick(cur,null);
    fetch(NOM+'reverse?format=jsonv2&zoom=18&accept-language=es&lat='+cur.lat+'&lon='+cur.lng).then(function(r){return r.json()}).then(function(j){
      var a=j&&j.address||{};onPick(cur,a);setStatus('Ubicación marcada: '+[a.road,a.suburb||a.neighbourhood,matchLoc(a)].filter(Boolean).join(', '),true)},function(){setStatus('Ubicación marcada',true)})}
  function search(){var t=q.value.trim();if(!t)return;res.textContent='Buscando…';
    fetch(NOM+'search?format=jsonv2&limit=5&accept-language=es&countrycodes=mx&viewbox=-99.05,19.35,-98.55,18.85&bounded=1&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(list){res.textContent='';
      if(!list.length){res.appendChild(el('div',{class:'cap',style:'margin:0',text:'No encontré esa dirección. Toca el mapa directamente donde está tu casa.'}));return}
      list.forEach(function(it){res.appendChild(el('button',{class:'mapopt',type:'button',text:it.display_name.split(',').slice(0,4).join(','),onclick:function(){res.textContent='';place(+it.lat,+it.lon,true)}}))})},function(){res.textContent='No se pudo buscar. Toca el mapa directamente.'})}
  q.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();search()}});
  var me=el('button',{class:'btn sec sm',type:'button',onclick:function(){if(!navigator.geolocation){setStatus('Tu teléfono no permite compartir ubicación aquí.');return}setStatus('Buscando dónde estás…');
    navigator.geolocation.getCurrentPosition(function(p){place(p.coords.latitude,p.coords.longitude,true)},function(){setStatus('No se pudo. Revisa el permiso de ubicación o toca el mapa.')},{enableHighAccuracy:true,timeout:15000})}},[svg(ICO.pin),'Estoy en mi casa ahora']);
  box.appendChild(el('div',{class:'maprow'},[q,el('button',{class:'btn sm',type:'button',text:'Buscar',onclick:search})]));
  box.appendChild(res);box.appendChild(area);box.appendChild(el('div',{class:'maprow'},[me]));box.appendChild(status);
  setStatus(cur?'Ubicación guardada':'Aún no marcas tu casa.',!!cur);
  loadLeaflet().then(function(){
    map=L.map(area,{zoomControl:true,attributionControl:true}).setView(cur?[cur.lat,cur.lng]:CENTRO,cur?17:13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    if(cur){var c=cur;mk=null;place(c.lat,c.lng,false)}
    map.on('click',function(e){place(e.latlng.lat,e.latlng.lng,false)});
    setTimeout(function(){map.invalidateSize()},200)
  },function(){area.textContent='No se pudo cargar el mapa. Usa "Estoy en mi casa ahora" o marca la casilla de abajo.'});
  return box}

/* ---------- formulario de datos del cliente (registro y Mi cuenta) ---------- */
function field(id,label,node,hint){return el('div',{class:'field'},[el('label',{for:id,text:label}),node,hint?el('div',{class:'cap',style:'margin-top:0',text:hint}):null])}
function perfilForm(v,opt){
  v=v||{};var gps=v.gps||null;
  var nombre=el('input',{id:'pf_n',type:'text',autocomplete:'name',value:v.nombre||'',placeholder:'Nombre y apellido o nombre del negocio'});
  var tel=el('input',{id:'pf_t',type:'tel',inputmode:'tel',autocomplete:'tel',value:v.tel||'',placeholder:'10 dígitos'});
  var loc=el('select',{id:'pf_l'},[el('option',{value:'',text:'Elige tu localidad'})].concat(LOCS.map(function(l){return el('option',{value:l,text:l})})));loc.value=v.loc||'';
  var calle=el('input',{id:'pf_c',type:'text',autocomplete:'address-line1',value:v.calle||'',placeholder:'Calle y número'});
  var col=el('input',{id:'pf_o',type:'text',autocomplete:'address-line2',value:v.colonia||'',placeholder:'Colonia o barrio'});
  var ref=el('input',{id:'pf_r',type:'text',value:v.ref||'',placeholder:'Ej. portón negro, frente a la escuela'});
  var mapa=mapPicker(gps,function(g,addr){gps=g;if(err)err.textContent="";
    if(addr){var L2=matchLoc(addr);if(L2)loc.value=L2;
      var road=addr.road||addr.pedestrian||addr.residential||addr.footway||'';
      if(road&&(!calle.value||calle.dataset.auto==='1')){calle.value=road+(addr.house_number?' '+addr.house_number:'');calle.dataset.auto='1'}
      var c2=addr.suburb||addr.neighbourhood||addr.quarter||addr.hamlet||'';
      if(c2&&(!col.value||col.dataset.auto==='1')){col.value=c2;col.dataset.auto='1'}}});
  var noMapa=el('input',{type:'checkbox',id:'pf_nm',checked:!!v.sinMapa});
  [calle,col].forEach(function(i){i.addEventListener('input',function(){i.dataset.auto=''})});
  var extra=opt.extra||[];
  var err=el('div',{class:'err',role:'alert'});
  var btn=el('button',{class:'btn wide',type:'submit',text:opt.submit});
  var f=el('form',{class:'panel',novalidate:true},extra.concat([
    field('pf_n','Nombre',nombre),field('pf_t','Teléfono',tel,'Te marcamos o escribimos aquí para confirmar tu pedido.'),
    el('div',{class:'two'},[field('pf_l','Localidad',loc),field('pf_c','Calle y número',calle)]),
    el('div',{class:'two'},[field('pf_o','Colonia',col),field('pf_r','Referencias',ref)]),
    err,btn]));
  f.insertBefore(el('div',{class:'field'},[el('span',{class:'lb2',text:'Tu casa o negocio en el mapa'}),el('div',{class:'cap',style:'margin:0',text:'Busca tu calle o toca el mapa donde está tu casa. Con eso llenamos localidad, calle y colonia; revisa el número y agrega referencias.'}),mapa,el('label',{class:'check'},[noMapa,'No encuentro mi casa en el mapa (la explico en referencias)'])]),f.querySelector('#pf_l').closest('.two'));
  f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';
    var val={nombre:nombre.value.trim(),tel:tel.value.replace(/\D/g,''),loc:loc.value,calle:calle.value.trim(),colonia:col.value.trim(),ref:ref.value.trim(),gps:gps};
    if(!val.nombre){err.textContent='Falta tu nombre.';nombre.focus();return}
    if(!/^\d{10}$/.test(val.tel)){err.textContent='El teléfono debe tener 10 dígitos.';tel.focus();return}
    if(!gps&&!noMapa.checked){err.textContent='Marca tu casa en el mapa, o si no la encuentras marca la casilla y explícala en referencias.';return}
    val.sinMapa=!gps;
    if(!val.loc||!val.calle){err.textContent='Elige tu localidad y escribe calle y número para que no haya errores en la entrega.';return}
    if(noMapa.checked&&!gps&&val.ref.length<10){err.textContent='Sin mapa, escribe referencias claras para que el chofer encuentre tu casa.';return}
    var pre=opt.validate&&opt.validate();if(pre){err.textContent=pre;return}
    btn.disabled=true;var t=btn.textContent;btn.textContent='Guardando…';
    opt.onSubmit(val,function(ok,bad){btn.disabled=false;btn.textContent=t;if(bad)err.textContent=bad;else if(ok&&window.HJ_toast)window.HJ_toast(ok)})});
  return f}
window.HJ_UI={perfilForm:perfilForm};
window.HJ_toast=function(t){var n=$('toast');if(!n)return;n.textContent=t;n.hidden=false;clearTimeout(window.HJ_toast.t);window.HJ_toast.t=setTimeout(function(){n.hidden=true},2400)};

/* ---------- pantallas de entrada ---------- */
var gate=$('gate'),app=$('app');
function topBar(){var mark=document.querySelector('.mast .mark');var t=el('div',{class:'gate-top'},[el('div',{class:'wrap'},[mark?mark.cloneNode(true):el('b',{text:'HERRAJUQ'}),el('div',{class:'mast-sub',text:'Herrajes y Aluminio Juquila'})])]);return t}
function screen(kids){app.hidden=true;gate.hidden=false;gate.textContent='';gate.appendChild(topBar());gate.appendChild(el('div',{class:'gate-body'},kids));window.scrollTo(0,0)}
function loading(t){screen([el('div',{class:'row'},[el('div',{class:'spin','aria-hidden':'true'}),el('p',{text:t})])])}
function login(pref){
  var email=el('input',{id:'lg_e',type:'email',autocomplete:'email',value:pref||'',placeholder:'tucorreo@ejemplo.com'});
  var pass=el('input',{id:'lg_p',type:'password',autocomplete:'current-password',placeholder:'Tu contraseña'});
  var err=el('div',{class:'err',role:'alert'}),btn=el('button',{class:'btn wide',type:'submit',text:'Entrar'});
  var f=el('form',{class:'panel',novalidate:true},[field('lg_e','Correo',email),field('lg_p','Contraseña',pass),err,btn]);
  f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';btn.disabled=true;
    auth.signInWithEmailAndPassword(email.value.trim(),pass.value).catch(function(x){btn.disabled=false;err.textContent=msgOf(x)})});
  screen([el('h1',{text:'Entra para hacer tu pedido'}),el('p',{text:'Ve el catálogo con fotos y fichas, arma tu pedido y mándalo a la tienda. Sin precios: te los confirmamos al recibirlo.'}),f,
    el('div',{class:'row'},[el('span',{class:'cap',style:'margin:0',text:'¿Primera vez?'}),el('button',{class:'btn sec',type:'button',text:'Crear mi cuenta',onclick:function(){registro(email.value)}})]),
    el('button',{class:'link',type:'button',style:'align-self:flex-start',text:'Olvidé mi contraseña',onclick:function(){var m=email.value.trim();if(!m){err.textContent='Escribe tu correo arriba y vuelve a tocar aquí.';return}auth.sendPasswordResetEmail(m).then(function(){err.style.color='var(--glass)';err.textContent='Te mandamos un correo para cambiar tu contraseña.'},function(x){err.textContent=msgOf(x)})}})])}
function registro(pref){
  var email=el('input',{id:'rg_e',type:'email',autocomplete:'email',value:pref||'',placeholder:'tucorreo@ejemplo.com'});
  var pass=el('input',{id:'rg_p',type:'password',autocomplete:'new-password',placeholder:'Mínimo 6 caracteres'});
  var ok=el('input',{type:'checkbox',id:'rg_ok'});
  var form=perfilForm({},{submit:'Crear mi cuenta',extra:[el('h3',{text:'Tu cuenta'}),field('rg_e','Correo',email),field('rg_p','Contraseña',pass),el('h3',{text:'Tus datos de entrega'})],
    validate:function(){if(!/\S+@\S+\.\S+/.test(email.value))return 'Escribe un correo válido.';if(pass.value.length<6)return 'La contraseña debe tener al menos 6 caracteres.';if(!ok.checked)return 'Acepta el uso de tus datos para poder registrarte.';return ''},
    onSubmit:function(v,done){pendingProfile=v;
      auth.createUserWithEmailAndPassword(email.value.trim(),pass.value).then(function(c){return saveNewProfile(c.user,v)}).catch(function(x){pendingProfile=null;done(null,msgOf(x))})}});
  form.insertBefore(el('label',{class:'check'},[ok,'Acepto que Herrajuq guarde mi nombre, teléfono y dirección solo para atender y entregar mis pedidos. Puedo borrar mi cuenta cuando quiera desde Mi cuenta.']),form.querySelector('.err'));
  screen([el('h1',{text:'Crea tu cuenta'}),el('p',{text:'Guardamos tus datos de entrega desde ahora para que tus pedidos lleguen sin errores. Los puedes cambiar después en Mi cuenta.'}),form,
    el('button',{class:'link',type:'button',style:'align-self:flex-start',text:'Ya tengo cuenta, quiero entrar',onclick:function(){login(email.value)}})])}
function completar(u){
  var form=perfilForm({},{submit:'Guardar y entrar',onSubmit:function(v,done){saveNewProfile(u,v).catch(function(x){done(null,msgOf(x))})}});
  screen([el('h1',{text:'Completa tus datos'}),el('p',{text:'Antes de entrar, dinos a dónde te entregamos.'}),form,el('button',{class:'link',type:'button',text:'Salir',onclick:function(){auth.signOut()}})])}
function cerrado(estado){
  screen([el('h1',{text:estado==='eliminado'?'Esta cuenta ya no está activa':'Tu cuenta está pausada'}),el('p',{text:'Para hacer pedidos comunícate con la tienda por WhatsApp al 55 4800 9223.'}),el('button',{class:'btn sec',type:'button',text:'Salir',onclick:function(){auth.signOut()}})])}
function errorPantalla(t){screen([el('h1',{text:'No pudimos abrir el catálogo'}),el('p',{text:t}),el('button',{class:'btn',type:'button',text:'Reintentar',onclick:function(){location.reload()}})])}

/* ---------- Firebase ---------- */
if(!window.firebase||!window.HJ_CONFIG||!window.HJ_CONFIG.apiKey||/PEGA_AQUI/.test(window.HJ_CONFIG.apiKey)){errorPantalla('Falta configurar Firebase: pega tu firebaseConfig en el archivo config.js.');return}
firebase.initializeApp(window.HJ_CONFIG);
var auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
var pendingProfile=null,started=false;
function saveNewProfile(u,v){
  var d=Object.assign({},v,{email:u.email,estado:'activo',creado:FV.serverTimestamp(),actualizado:FV.serverTimestamp()});
  return db.collection('clientes').doc(u.uid).set(d).then(function(){pendingProfile=null;return enter(u)})}

/* catálogo en caché local (IndexedDB) por versión */
function idb(){return new Promise(function(res){try{var r=indexedDB.open('herrajuq',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function idbGet(k){return idb().then(function(d){if(!d)return null;return new Promise(function(res){try{var q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})})}
function idbSet(k,v){return idb().then(function(d){if(!d)return;return new Promise(function(res){try{var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})})}
function loadCatalog(){
  return db.collection('catalogo').doc('meta').get().then(function(m){
    if(!m.exists)throw {code:'sin-catalogo'};var meta=m.data();
    return idbGet('cat').then(function(c){
      if(c&&c.version===meta.version)return c;
      loading('Descargando el catálogo, solo la primera vez…');
      return Promise.all(meta.partes.map(function(id){return db.collection('catalogo').doc(id).get()}).concat(meta.fotos.map(function(id){return db.collection('fotos').doc(id).get()}))).then(function(docs){
        var data={perfiles:[],otros:[]},fotos={},det={};
        docs.forEach(function(d){var j=JSON.parse(d.data().json),id=d.id;
          if(id==='perfiles')data.perfiles=j;else if(/^otros/.test(id))data.otros=data.otros.concat(j);else if(/^fichas/.test(id))Object.assign(det,j);else Object.assign(fotos,j)});
        var c2={version:meta.version,data:data,fotos:fotos,det:det,whatsapp:meta.whatsapp};idbSet('cat',c2);return c2})})})}
function enter(u){
  if(started)return Promise.resolve();
  loading('Abriendo tu cuenta…');
  return db.collection('clientes').doc(u.uid).get().then(function(s){
    if(!s.exists){if(pendingProfile)return;completar(u);return}
    var p=s.data();if(p.estado!=='activo'){cerrado(p.estado);return}
    loading('Cargando el catálogo…');
    return loadCatalog().then(function(c){
      started=true;gate.hidden=true;gate.textContent='';app.hidden=false;
      var USER=Object.assign({uid:u.uid,email:u.email},p);
      window.HJ_START(c.data,c.fotos,c.det,USER,{
        whatsapp:c.whatsapp,
        saveOrder:function(o){o.uid=u.uid;o.email=u.email;o.estado='nuevo';o.creado=FV.serverTimestamp();return db.collection('pedidos').doc(o.folio).set(o)},
        updateProfile:function(v){return db.collection('clientes').doc(u.uid).update(Object.assign({},v,{actualizado:FV.serverTimestamp()}))},
        myOrders:function(){return db.collection('pedidos').where('uid','==',u.uid).get().then(function(q){return q.docs.map(function(d){var o=d.data();o.creado=o.creado&&o.creado.toMillis?o.creado.toMillis():0;return o}).sort(function(a,b){return b.creado-a.creado}).slice(0,30)})},
        signOut:function(){auth.signOut().then(function(){location.reload()})},
        deleteAccount:function(){return db.collection('clientes').doc(u.uid).update({estado:'eliminado',tel:'',calle:'',colonia:'',ref:'',gps:null,actualizado:FV.serverTimestamp()}).then(function(){return u.delete()}).then(function(){location.reload()})}
      })})}).catch(function(e){
      if(e&&e.code==='permission-denied'){cerrado('pausado');return}
      if(e&&e.code==='sin-catalogo'){errorPantalla('El catálogo todavía no está cargado en la base de datos.');return}
      errorPantalla('Revisa tu conexión a internet ('+((e&&e.code)||'error')+').')})}
auth.onAuthStateChanged(function(u){if(!u){if(!started)login();return}if(pendingProfile)return;enter(u)});
loading('Cargando…');
})();
